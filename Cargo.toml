[workspace]
resolver = "2"
members = [
    "crates/airplay-core",  # paquete renombrado a `cap-core` (Conexión AirPlay)
    "crates/audio-capture",
    "crates/audio-encode",
    "src-tauri",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Pablo Díaz Ruipérez <diazruiperezpablo@gmail.com>"]
repository = "https://github.com/Pabldi08/AirSend"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
ringbuf = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Local override of the airplay2-rs fork (HomePod OS 27 debugging)
[patch."https://github.com/Pabldi08/airplay2-rs"]
airplay-audio = { path = "../airplay2-rs/crates/airplay-audio" }
airplay-client = { path = "../airplay2-rs/crates/airplay-client" }
airplay-core = { path = "../airplay2-rs/crates/airplay-core" }
airplay-crypto = { path = "../airplay2-rs/crates/airplay-crypto" }
airplay-discovery = { path = "../airplay2-rs/crates/airplay-discovery" }
airplay-pairing = { path = "../airplay2-rs/crates/airplay-pairing" }
airplay-resampler = { path = "../airplay2-rs/crates/airplay-resampler" }
airplay-rtsp = { path = "../airplay2-rs/crates/airplay-rtsp" }
airplay-timing = { path = "../airplay2-rs/crates/airplay-timing" }
