<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirSend</title>
    <link rel="stylesheet" href="/src/flyout.css" />
  </head>
  <body>
    <div class="flyout">
      <div class="top">
        <div class="info">
          <span id="name" class="name"></span>
          <span id="state" class="state"></span>
        </div>
        <button id="open-main" class="icon" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      <div class="controls">
        <svg class="speaker" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <input id="volume" type="range" min="0" max="100" value="20" />
        <output id="vol-out">20%</output>
        <button id="toggle" class="toggle" type="button"></button>
      </div>
    </div>
    <script type="module" src="/src/flyout.ts"></script>
  </body>
</html>
